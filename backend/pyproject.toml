[project]
name = "backend"
version = "0.1.0"
description = "AI/ML downscaling of satellite-based NO2 air quality maps (PSAI02)"
authors = [
    { name = "akshaytolwani123", email = "akshaytolwanipython@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
]

[project.scripts]
serve = "backend.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
